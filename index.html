<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Змейка — пауза в левом углу</title>
<style>
* {
    user-select: none;
    touch-action: manipulation;
}
body {
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 15px;
    font-family: monospace;
}
.container {
    background: #0f0f1a;
    padding: 12px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    position: relative;
}
.canvas-wrapper {
    position: relative;
    display: inline-block;
    width: 100%;
    text-align: center;
}
canvas {
    background: #111;
    border: 3px solid #e94560;
    border-radius: 10px;
    display: block;
    margin: 0 auto;
}
/* Кнопка паузы в верхнем левом углу (поверх канваса) */
.pause-corner {
    position: absolute;
    top: 12px;
    left: 12px;
    background: #1a1a2e;
    border: 2px solid #e94560;
    color: white;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    z-index: 25;
    backdrop-filter: blur(4px);
    background: rgba(26, 26, 46, 0.85);
    transition: 0.07s linear;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.pause-corner:active {
    transform: scale(0.94);
    background: #e94560;
}
.info {
    text-align: center;
    margin-top: 10px;
}
.score-box {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 5px;
    flex-wrap: wrap;
    align-items: center;
}
.score, .best {
    color: white;
    font-size: 15px;
    background: #1a1a2e;
    padding: 4px 12px;
    border-radius: 30px;
    display: inline-block;
}
.score span, .best span {
    color: #e94560;
    font-weight: bold;
    font-size: 19px;
}
.best span {
    color: #f9ca24;
}
button {
    background: #e94560;
    border: none;
    color: white;
    padding: 6px 16px;
    margin: 4px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    font-family: monospace;
    transition: 0.07s;
}
button:active {
    transform: scale(0.96);
}

/* КРЕСТОВИДНЫЙ ГЕЙМПАД */
.dpad {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 15px;
}
.dpad-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 0;
}
.ctrl-btn {
    background: #1a2a4a;
    width: 60px;
    height: 60px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 0 #0a1220;
    transition: 0.03s linear;
    touch-action: manipulation;
}
.ctrl-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #0a1220;
}
.empty {
    background: transparent;
    box-shadow: none;
    cursor: default;
}
.empty:active {
    transform: none;
    box-shadow: none;
}
.hint {
    text-align: center;
    margin-top: 10px;
    color: #777;
    font-size: 11px;
    background: #151520;
    padding: 4px 10px;
    border-radius: 30px;
    display: inline-block;
    width: auto;
}
.new-record {
    animation: pulse 0.5s ease-in-out 3;
}
@keyframes pulse {
    0% { transform: scale(1); background: #e94560; }
    50% { transform: scale(1.05); background: #f39c12; box-shadow: 0 0 8px gold; }
    100% { transform: scale(1); background: #e94560; }
}

/* СТАРТОВОЕ МЕНЮ */
.start-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 10, 26, 0.94);
    backdrop-filter: blur(4px);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 30;
    transition: all 0.2s ease;
}
.start-card {
    background: #1a1a2e;
    padding: 28px 20px;
    border-radius: 40px;
    text-align: center;
    border: 2px solid #e94560;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    width: 220px;
}
.start-card h2 {
    color: #f9ca24;
    font-size: 28px;
    margin: 0 0 8px 0;
    letter-spacing: 2px;
}
.start-card p {
    color: #ddd;
    font-size: 18px;
    margin: 12px 0;
    font-weight: bold;
}
.start-btn {
    background: #e94560;
    border: none;
    color: white;
    font-size: 22px;
    font-weight: bold;
    padding: 10px 28px;
    border-radius: 60px;
    margin-top: 16px;
    cursor: pointer;
    transition: 0.1s linear;
    font-family: monospace;
    box-shadow: 0 5px 0 #8b2c3f;
}
.start-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #8b2c3f;
}
.snake-icon {
    font-size: 42px;
    margin: 5px 0;
}
.hide-overlay {
    display: none;
}

/* Индикатор паузы по центру */
.pause-marker {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: #f9ca24;
    font-size: 28px;
    font-weight: bold;
    padding: 12px 24px;
    border-radius: 60px;
    font-family: monospace;
    pointer-events: none;
    z-index: 20;
    backdrop-filter: blur(6px);
    border: 1px solid #e94560;
    white-space: nowrap;
    letter-spacing: 3px;
}
.hide-pause {
    display: none;
}
</style>
</head>
<body>
<div class="container" style="position: relative;">
<div class="canvas-wrapper">
    <canvas id="game" width="300" height="300"></canvas>
    <!-- Кнопка паузы в верхнем левом углу -->
    <div id="pauseCornerBtn" class="pause-corner" title="Пауза">⏸</div>
    <!-- Индикатор паузы поверх канваса -->
    <div id="pauseIndicator" class="pause-marker hide-pause">⏸ ПАУЗА</div>
</div>
<div class="info">
<div class="score-box">
    <div class="score">🍎 <span id="score">0</span></div>
    <div class="best">🏆 <span id="bestScore">0</span></div>
</div>
<button id="restart">🔄 НОВАЯ ИГРА</button>
</div>

<!-- КРЕСТОВИДНЫЙ ГЕЙМПАД -->
<div class="dpad">
    <div class="dpad-row">
        <div class="empty"></div>
        <div class="ctrl-btn" data-dir="up">▲</div>
        <div class="empty"></div>
    </div>
    <div class="dpad-row">
        <div class="ctrl-btn" data-dir="left">◀</div>
        <div class="ctrl-btn" data-dir="down">▼</div>
        <div class="ctrl-btn" data-dir="right">▶</div>
    </div>
</div>
<div class="hint">▲ ▼ ◀ ▶ &nbsp;&nbsp;| &nbsp;⏸ пауза (кнопка сверху слева / пробел) • личный рекорд</div>

<!-- СТАРТОВОЕ МЕНЮ -->
<div id="startOverlay" class="start-overlay">
    <div class="start-card">
        <div class="snake-icon">🐍</div>
        <h2>Ты готов?</h2>
        <p>🎮 Змейка ждёт</p>
        <button id="startGameBtn" class="start-btn">▶ СТАРТ</button>
        <div style="margin-top: 12px; font-size: 10px; color: #aaa;">клавиши ↑ ↓ ← →</div>
    </div>
</div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const scoreSpan=document.getElementById('score');
const bestScoreSpan=document.getElementById('bestScore');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startGameBtn');
const pauseCornerBtn = document.getElementById('pauseCornerBtn');
const pauseIndicator = document.getElementById('pauseIndicator');

const GRID_SIZE = 20;
const CELL_SIZE = canvas.width / GRID_SIZE;

let snake=[[10,10],[9,10],[8,10],[7,10]];
let dir='right';
let nextDir='right';
let food=[15,10];
let score=0;
let gameOver=false;
let interval=null;
let isGameActive = false;      // активен ли игровой цикл (движение)
let isPaused = false;          // ручная пауза

const GAME_SPEED_MS = 210;

// ----- РЕКОРД -----
function loadBestScore() {
    let best = localStorage.getItem('snakeBestScore');
    if (best === null) {
        localStorage.setItem('snakeBestScore', '0');
        return 0;
    }
    return parseInt(best, 10);
}
function updateBestScoreUI() {
    let best = loadBestScore();
    bestScoreSpan.innerText = best;
}
function checkAndUpdateRecord(currentScore) {
    let best = loadBestScore();
    if (currentScore > best) {
        localStorage.setItem('snakeBestScore', currentScore.toString());
        updateBestScoreUI();
        const bestElement = document.getElementById('bestScore');
        bestElement.classList.add('new-record');
        setTimeout(() => {
            bestElement.classList.remove('new-record');
        }, 600);
        return true;
    }
    return false;
}

// Генерация еды
function randomFood(){
    let free=[];
    for(let i=0;i<GRID_SIZE;i++){
        for(let j=0;j<GRID_SIZE;j++){
            let ok=true;
            for(let s of snake)if(s[0]==i&&s[1]==j){ok=false;break;}
            if(ok)free.push([i,j]);
        }
    }
    if(free.length==0)return true;
    food=free[Math.floor(Math.random()*free.length)];
    return false;
}

// Отрисовка
function draw(){
    ctx.fillStyle='#111';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    
    ctx.strokeStyle = '#202030';
    ctx.lineWidth = 0.5;
    for(let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
    }
    
    for(let i=0;i<snake.length;i++){
        let x=snake[i][0]*CELL_SIZE,y=snake[i][1]*CELL_SIZE;
        if(i===0) ctx.fillStyle='#3cff7a';
        else ctx.fillStyle='#2ecc71';
        ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2);
    }
    
    if(snake.length>0 && !gameOver){
        let x=snake[0][0]*CELL_SIZE,y=snake[0][1]*CELL_SIZE;
        ctx.fillStyle = '#ffffff';
        let eyeSize = 3;
        if(dir === 'right') {
            ctx.fillRect(x+CELL_SIZE-7, y+5, eyeSize, eyeSize);
            ctx.fillRect(x+CELL_SIZE-7, y+CELL_SIZE-9, eyeSize, eyeSize);
        } else if(dir === 'left') {
            ctx.fillRect(x+2, y+5, eyeSize, eyeSize);
            ctx.fillRect(x+2, y+CELL_SIZE-9, eyeSize, eyeSize);
        } else if(dir === 'up') {
            ctx.fillRect(x+5, y+2, eyeSize, eyeSize);
            ctx.fillRect(x+CELL_SIZE-9, y+2, eyeSize, eyeSize);
        } else if(dir === 'down') {
            ctx.fillRect(x+5, y+CELL_SIZE-7, eyeSize, eyeSize);
            ctx.fillRect(x+CELL_SIZE-9, y+CELL_SIZE-7, eyeSize, eyeSize);
        } else {
            ctx.fillRect(x+5, y+5, eyeSize, eyeSize);
            ctx.fillRect(x+CELL_SIZE-9, y+5, eyeSize, eyeSize);
        }
    }
    
    let fx=food[0]*CELL_SIZE,fy=food[1]*CELL_SIZE;
    ctx.fillStyle='#e74c3c';
    ctx.beginPath();
    ctx.ellipse(fx+CELL_SIZE/2, fy+CELL_SIZE/2, CELL_SIZE*0.4, CELL_SIZE*0.4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#f1c40f';
    ctx.beginPath();
    ctx.moveTo(fx+CELL_SIZE-6, fy+3);
    ctx.lineTo(fx+CELL_SIZE-2, fy+8);
    ctx.lineTo(fx+CELL_SIZE-8, fy+8);
    ctx.fill();
    ctx.fillStyle='#27ae60';
    ctx.fillRect(fx+CELL_SIZE-4, fy+1, 2, 5);
    
    if(gameOver){
        ctx.fillStyle='rgba(0,0,0,0.8)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#e94560';
        ctx.font='bold 18px monospace';
        ctx.fillText('GAME OVER',85,135);
        ctx.font='11px monospace';
        ctx.fillStyle='#dddddd';
        ctx.fillText('нажми "НОВАЯ ИГРА"',95,170);
        ctx.fillStyle='#f9ca24';
        ctx.font='bold 10px monospace';
        let best = loadBestScore();
        ctx.fillText(`🏆 ЛУЧШИЙ: ${best}`, 108, 195);
    }
}

// --- Управление паузой ---
function setPause(state) {
    if (gameOver) return;
    if (!isGameActive) return;
    isPaused = state;
    if (isPaused) {
        pauseIndicator.classList.remove('hide-pause');
        if (interval) clearInterval(interval);
        interval = null;
        // меняем иконку на ▶ (Play)
        pauseCornerBtn.innerHTML = '▶';
        pauseCornerBtn.title = 'Продолжить';
    } else {
        pauseIndicator.classList.add('hide-pause');
        if (interval) clearInterval(interval);
        interval = setInterval(update, GAME_SPEED_MS);
        pauseCornerBtn.innerHTML = '⏸';
        pauseCornerBtn.title = 'Пауза';
    }
}

function togglePause() {
    if (!isGameActive || gameOver) return;
    setPause(!isPaused);
}

// --- Логика движения ---
function update(){
    if(gameOver) return;
    if(!isGameActive || isPaused) return;
    
    dir=nextDir;
    let head=[snake[0][0],snake[0][1]];
    if(dir=='right')head[0]++;
    if(dir=='left')head[0]--;
    if(dir=='up')head[1]--;
    if(dir=='down')head[1]++;
    
    let eat=(head[0]==food[0]&&head[1]==food[1]);
    snake.unshift([head[0],head[1]]);
    if(!eat)snake.pop();
    else{
        score++;
        scoreSpan.innerText=score;
        let win=randomFood();
        if(win){
            gameOver=true;
            stopGameLoop();
            checkAndUpdateRecord(score);
            draw();
            return;
        }
    }
    
    if(head[0]<0||head[0]>=GRID_SIZE||head[1]<0||head[1]>=GRID_SIZE){
        gameOver=true;
        stopGameLoop();
        checkAndUpdateRecord(score);
        draw();
        return;
    }
    for(let i=1;i<snake.length;i++){
        if(snake[i][0]==head[0]&&snake[i][1]==head[1]){
            gameOver=true;
            stopGameLoop();
            checkAndUpdateRecord(score);
            draw();
            return;
        }
    }
    draw();
}

function stopGameLoop() {
    if(interval) {
        clearInterval(interval);
        interval = null;
    }
    isGameActive = false;
    isPaused = false;
    pauseIndicator.classList.add('hide-pause');
    pauseCornerBtn.innerHTML = '⏸';
    pauseCornerBtn.title = 'Пауза';
}

function startGameLoop() {
    if(interval) clearInterval(interval);
    isGameActive = true;
    gameOver = false;
    isPaused = false;
    pauseIndicator.classList.add('hide-pause');
    interval = setInterval(update, GAME_SPEED_MS);
    pauseCornerBtn.innerHTML = '⏸';
    pauseCornerBtn.title = 'Пауза';
}

// Полный сброс (без запуска)
function fullReset() {
    if(interval) clearInterval(interval);
    isGameActive = false;
    gameOver = false;
    isPaused = false;
    pauseIndicator.classList.add('hide-pause');
    pauseCornerBtn.innerHTML = '⏸';
    pauseCornerBtn.title = 'Пауза';
    snake = [[10,10],[9,10],[8,10],[7,10]];
    dir = 'right';
    nextDir = 'right';
    score = 0;
    scoreSpan.innerText = '0';
    food = [15,10];
    randomFood();
    draw();
}

// Старт игры (из меню или перезапуск)
function launchGame() {
    fullReset();
    startGameLoop();
    startOverlay.classList.add('hide-overlay');
}

// Перезапуск через кнопку "НОВАЯ ИГРА" — показываем меню
function restartWithMenu() {
    if(interval) clearInterval(interval);
    isGameActive = false;
    gameOver = false;
    isPaused = false;
    pauseIndicator.classList.add('hide-pause');
    pauseCornerBtn.innerHTML = '⏸';
    pauseCornerBtn.title = 'Пауза';
    fullReset();
    startOverlay.classList.remove('hide-overlay');
}

// Инициализация UI и обработчиков
updateBestScoreUI();
fullReset();
draw();
startOverlay.classList.remove('hide-overlay');

// Кнопка СТАРТ
startBtn.addEventListener('click', (e) => {
    e.preventDefault();
    launchGame();
});

// Кнопка паузы в левом верхнем углу
pauseCornerBtn.addEventListener('click', () => {
    if (startOverlay.classList.contains('hide-overlay') && isGameActive && !gameOver) {
        togglePause();
    }
});

// Кнопка НОВАЯ ИГРА
document.getElementById('restart').onclick = () => {
    restartWithMenu();
};

// Клавиатура
document.addEventListener('keydown', (e) => {
    // Если меню открыто — реагируем только на пробел / Enter для старта
    if (!startOverlay.classList.contains('hide-overlay')) {
        if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            launchGame();
        }
        return;
    }
    
    // Пауза по пробелу (если игра активна и не game over)
    if (e.code === 'Space') {
        e.preventDefault();
        if (isGameActive && !gameOver) {
            togglePause();
        } else if (gameOver) {
            restartWithMenu();
        }
        return;
    }
    
    // Управление движением (только если игра активна, не на паузе, не game over)
    if (!isGameActive || gameOver || isPaused) return;
    
    let k = e.key;
    if (k === 'ArrowUp' && dir !== 'down') { nextDir = 'up'; e.preventDefault(); }
    else if (k === 'ArrowDown' && dir !== 'up') { nextDir = 'down'; e.preventDefault(); }
    else if (k === 'ArrowLeft' && dir !== 'right') { nextDir = 'left'; e.preventDefault(); }
    else if (k === 'ArrowRight' && dir !== 'left') { nextDir = 'right'; e.preventDefault(); }
});

// Сенсорный геймпад (движение только при активной игре, без паузы, без меню)
const ctrlBtns = document.querySelectorAll('.ctrl-btn');
ctrlBtns.forEach(btn => {
    const handler = (e) => {
        e.preventDefault();
        if (!startOverlay.classList.contains('hide-overlay')) return;
        if (!isGameActive || gameOver || isPaused) return;
        const ndir = btn.getAttribute('data-dir');
        if (!ndir) return;
        if (ndir === 'up' && dir !== 'down') nextDir = 'up';
        else if (ndir === 'down' && dir !== 'up') nextDir = 'down';
        else if (ndir === 'left' && dir !== 'right') nextDir = 'left';
        else if (ndir === 'right' && dir !== 'left') nextDir = 'right';
    };
    btn.addEventListener('click', handler);
    btn.addEventListener('touchstart', handler, { passive: false });
});

// Защита от случайного клика по оверлею
startOverlay.addEventListener('click', (e) => e.stopPropagation());
</script>
</body>
</html>
