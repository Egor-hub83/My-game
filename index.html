<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Змейка — Стартовое меню</title>
<style>
* {
    user-select: none;
    touch-action: manipulation;
}
body {
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 15px;
    font-family: monospace;
}
.container {
    background: #0f0f1a;
    padding: 12px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    position: relative;
}
canvas {
    background: #111;
    border: 3px solid #e94560;
    border-radius: 10px;
    display: block;
    margin: 0 auto;
}
.info {
    text-align: center;
    margin-top: 10px;
}
.score-box {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 5px;
}
.score, .best {
    color: white;
    font-size: 16px;
    background: #1a1a2e;
    padding: 4px 12px;
    border-radius: 30px;
    display: inline-block;
}
.score span, .best span {
    color: #e94560;
    font-weight: bold;
    font-size: 20px;
}
.best span {
    color: #f9ca24;
}
button {
    background: #e94560;
    border: none;
    color: white;
    padding: 6px 16px;
    margin: 4px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    font-family: monospace;
    transition: 0.07s;
}
button:active {
    transform: scale(0.96);
}

/* КРЕСТОВИДНЫЙ ГЕЙМПАД */
.dpad {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 15px;
}
.dpad-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 0;
}
.ctrl-btn {
    background: #1a2a4a;
    width: 60px;
    height: 60px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 0 #0a1220;
    transition: 0.03s linear;
    touch-action: manipulation;
}
.ctrl-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #0a1220;
}
.empty {
    background: transparent;
    box-shadow: none;
    cursor: default;
}
.empty:active {
    transform: none;
    box-shadow: none;
}
.hint {
    text-align: center;
    margin-top: 10px;
    color: #777;
    font-size: 11px;
    background: #151520;
    padding: 4px 10px;
    border-radius: 30px;
    display: inline-block;
    width: auto;
}
.new-record {
    animation: pulse 0.5s ease-in-out 3;
}
@keyframes pulse {
    0% { transform: scale(1); background: #e94560; }
    50% { transform: scale(1.05); background: #f39c12; box-shadow: 0 0 8px gold; }
    100% { transform: scale(1); background: #e94560; }
}

/* СТАРТОВОЕ МЕНЮ (оверлей) */
.start-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 10, 26, 0.92);
    backdrop-filter: blur(4px);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    font-family: monospace;
    transition: all 0.2s ease;
}
.start-card {
    background: #1a1a2e;
    padding: 28px 20px;
    border-radius: 40px;
    text-align: center;
    border: 2px solid #e94560;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    width: 220px;
}
.start-card h2 {
    color: #f9ca24;
    font-size: 28px;
    margin: 0 0 8px 0;
    letter-spacing: 2px;
}
.start-card p {
    color: #ddd;
    font-size: 18px;
    margin: 12px 0;
    font-weight: bold;
}
.start-btn {
    background: #e94560;
    border: none;
    color: white;
    font-size: 22px;
    font-weight: bold;
    padding: 10px 28px;
    border-radius: 60px;
    margin-top: 16px;
    cursor: pointer;
    transition: 0.1s linear;
    font-family: monospace;
    box-shadow: 0 5px 0 #8b2c3f;
}
.start-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #8b2c3f;
}
.snake-icon {
    font-size: 42px;
    margin: 5px 0;
}
.hide-overlay {
    display: none;
}
</style>
</head>
<body>
<div class="container" style="position: relative;">
<canvas id="game" width="300" height="300"></canvas>
<div class="info">
<div class="score-box">
    <div class="score">🍎 ТЕКУЩИЙ <span id="score">0</span></div>
    <div class="best">🏆 РЕКОРД <span id="bestScore">0</span></div>
</div>
<button id="restart">🔄 НОВАЯ ИГРА</button>
</div>

<!-- КРЕСТОВИДНЫЙ ГЕЙМПАД -->
<div class="dpad">
    <div class="dpad-row">
        <div class="empty"></div>
        <div class="ctrl-btn" data-dir="up">▲</div>
        <div class="empty"></div>
    </div>
    <div class="dpad-row">
        <div class="ctrl-btn" data-dir="left">◀</div>
        <div class="ctrl-btn" data-dir="down">▼</div>
        <div class="ctrl-btn" data-dir="right">▶</div>
    </div>
</div>
<div class="hint">▲ ▼ ◀ ▶ &nbsp;&nbsp;| &nbsp;старт из меню • личный рекорд</div>

<!-- СТАРТОВОЕ МЕНЮ "Ты готов?" -->
<div id="startOverlay" class="start-overlay">
    <div class="start-card">
        <div class="snake-icon">🐍</div>
        <h2>Ты готов?</h2>
        <p>🎮 Змейка ждёт</p>
        <button id="startGameBtn" class="start-btn">▶ СТАРТ</button>
        <div style="margin-top: 12px; font-size: 10px; color: #aaa;">клавиши ↑ ↓ ← →</div>
    </div>
</div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const scoreSpan=document.getElementById('score');
const bestScoreSpan=document.getElementById('bestScore');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startGameBtn');

const GRID_SIZE = 20;
const CELL_SIZE = canvas.width / GRID_SIZE;

let snake=[[10,10],[9,10],[8,10],[7,10]];
let dir='right';
let nextDir='right';
let food=[15,10];
let score=0;
let gameOver=false;
let interval=null;
let isGameActive = false;      // активно ли игровое обновление (бежит змейка)
let gameLoopPaused = true;     // стартовое меню блокирует движение

const GAME_SPEED_MS = 210;

// ----- РАБОТА С РЕКОРДОМ (LocalStorage) -----
function loadBestScore() {
    let best = localStorage.getItem('snakeBestScore');
    if (best === null) {
        localStorage.setItem('snakeBestScore', '0');
        return 0;
    }
    return parseInt(best, 10);
}

function updateBestScoreUI() {
    let best = loadBestScore();
    bestScoreSpan.innerText = best;
}

function checkAndUpdateRecord(currentScore) {
    let best = loadBestScore();
    if (currentScore > best) {
        localStorage.setItem('snakeBestScore', currentScore.toString());
        updateBestScoreUI();
        const bestElement = document.getElementById('bestScore');
        bestElement.classList.add('new-record');
        setTimeout(() => {
            bestElement.classList.remove('new-record');
        }, 600);
        return true;
    }
    return false;
}

// Генерация еды (без столкновения)
function randomFood(){
    let free=[];
    for(let i=0;i<GRID_SIZE;i++){
        for(let j=0;j<GRID_SIZE;j++){
            let ok=true;
            for(let s of snake)if(s[0]==i&&s[1]==j){ok=false;break;}
            if(ok)free.push([i,j]);
        }
    }
    if(free.length==0)return true;
    food=free[Math.floor(Math.random()*free.length)];
    return false;
}

// Отрисовка всего (змейка, еда, сетка, GAME OVER)
function draw(){
    ctx.fillStyle='#111';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    
    // сетка
    ctx.strokeStyle = '#202030';
    ctx.lineWidth = 0.5;
    for(let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
    }
    
    // тело змейки
    for(let i=0;i<snake.length;i++){
        let x=snake[i][0]*CELL_SIZE,y=snake[i][1]*CELL_SIZE;
        if(i===0) ctx.fillStyle='#3cff7a';
        else ctx.fillStyle='#2ecc71';
        ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2);
    }
    
    // глаза головы, если игра не окончена (и даже на паузе в меню рисуем глаза)
    if(snake.length>0 && !gameOver){
        let x=snake[0][0]*CELL_SIZE,y=snake[0][1]*CELL_SIZE;
        ctx.fillStyle = '#ffffff';
        let eyeSize = 3;
        if(dir === 'right') {
            ctx.fillRect(x+CELL_SIZE-7, y+5, eyeSize, eyeSize);
            ctx.fillRect(x+CELL_SIZE-7, y+CELL_SIZE-9, eyeSize, eyeSize);
        } else if(dir === 'left') {
            ctx.fillRect(x+2, y+5, eyeSize, eyeSize);
            ctx.fillRect(x+2, y+CELL_SIZE-9, eyeSize, eyeSize);
        } else if(dir === 'up') {
            ctx.fillRect(x+5, y+2, eyeSize, eyeSize);
            ctx.fillRect(x+CELL_SIZE-9, y+2, eyeSize, eyeSize);
        } else if(dir === 'down') {
            ctx.fillRect(x+5, y+CELL_SIZE-7, eyeSize, eyeSize);
            ctx.fillRect(x+CELL_SIZE-9, y+CELL_SIZE-7, eyeSize, eyeSize);
        } else {
            ctx.fillRect(x+5, y+5, eyeSize, eyeSize);
            ctx.fillRect(x+CELL_SIZE-9, y+5, eyeSize, eyeSize);
        }
    }
    
    // еда
    let fx=food[0]*CELL_SIZE,fy=food[1]*CELL_SIZE;
    ctx.fillStyle='#e74c3c';
    ctx.beginPath();
    ctx.ellipse(fx+CELL_SIZE/2, fy+CELL_SIZE/2, CELL_SIZE*0.4, CELL_SIZE*0.4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#f1c40f';
    ctx.beginPath();
    ctx.moveTo(fx+CELL_SIZE-6, fy+3);
    ctx.lineTo(fx+CELL_SIZE-2, fy+8);
    ctx.lineTo(fx+CELL_SIZE-8, fy+8);
    ctx.fill();
    ctx.fillStyle='#27ae60';
    ctx.fillRect(fx+CELL_SIZE-4, fy+1, 2, 5);
    
    if(gameOver){
        ctx.fillStyle='rgba(0,0,0,0.8)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#e94560';
        ctx.font='bold 18px monospace';
        ctx.fillText('GAME OVER',85,135);
        ctx.font='11px monospace';
        ctx.fillStyle='#dddddd';
        ctx.fillText('нажми "НОВАЯ ИГРА"',95,170);
        ctx.fillStyle='#f9ca24';
        ctx.font='bold 10px monospace';
        let best = loadBestScore();
        ctx.fillText(`🏆 ЛУЧШИЙ: ${best}`, 108, 195);
    }
}

// Основной игровой цикл (move)
function update(){
    if(gameOver || !isGameActive) return; // если игра окончена или не активна — не двигаем
    
    dir=nextDir;
    let head=[snake[0][0],snake[0][1]];
    if(dir=='right')head[0]++;
    if(dir=='left')head[0]--;
    if(dir=='up')head[1]--;
    if(dir=='down')head[1]++;
    
    let eat=(head[0]==food[0]&&head[1]==food[1]);
    snake.unshift([head[0],head[1]]);
    if(!eat)snake.pop();
    else{
        score++;
        scoreSpan.innerText=score;
        let win=randomFood();
        if(win){
            gameOver=true;
            stopGameLoop();
            checkAndUpdateRecord(score);
            draw();
            return;
        }
    }
    
    // столкновения
    if(head[0]<0||head[0]>=GRID_SIZE||head[1]<0||head[1]>=GRID_SIZE){
        gameOver=true;
        stopGameLoop();
        checkAndUpdateRecord(score);
        draw();
        return;
    }
    for(let i=1;i<snake.length;i++){
        if(snake[i][0]==head[0]&&snake[i][1]==head[1]){
            gameOver=true;
            stopGameLoop();
            checkAndUpdateRecord(score);
            draw();
            return;
        }
    }
    draw();
}

function stopGameLoop() {
    if(interval) {
        clearInterval(interval);
        interval = null;
    }
    isGameActive = false;
}

function startGameLoop() {
    if(interval) clearInterval(interval);
    isGameActive = true;
    gameOver = false;
    interval = setInterval(update, GAME_SPEED_MS);
}

// Полностью сбросить состояние игры (но без автостарта)
function fullReset(keepMenu = true) {
    // останавливаем всё
    if(interval) {
        clearInterval(interval);
        interval = null;
    }
    isGameActive = false;
    gameOver = false;
    // сброс параметров
    snake = [[10,10],[9,10],[8,10],[7,10]];
    dir = 'right';
    nextDir = 'right';
    score = 0;
    scoreSpan.innerText = '0';
    food = [15,10];
    // гарантия, что еда не на змейке
    randomFood();
    draw();
}

// Функция СТАРТ (вызывается из меню или после перезапуска с активной игрой)
function startGame() {
    // Если уже игра активна — перезапускаем с чистой совестью
    if(interval) clearInterval(interval);
    fullReset(false);   // сброс без меню
    gameOver = false;
    isGameActive = true;
    // запускаем цикл
    interval = setInterval(update, GAME_SPEED_MS);
}

// Функция для рестарта (кнопка "НОВАЯ ИГРА"), которая также показывает меню (сохраняем опыт)
function restartFromButton() {
    // Полностью останавливаем всё
    if(interval) {
        clearInterval(interval);
        interval = null;
    }
    isGameActive = false;
    gameOver = false;
    fullReset(false);
    // Показываем стартовое меню заново (как в первый раз)
    startOverlay.classList.remove('hide-overlay');
    // Дополнительно рисуем статичную картинку (змейка уже стоит)
    draw();
}

// Настоящий старт из оверлея -> скрываем меню и запускаем игру
function launchGame() {
    startOverlay.classList.add('hide-overlay');
    startGame(); // чистая активная игра
}

// --- Инициализация и обработчики ---
updateBestScoreUI();

// начальная отрисовка (змейка и еда видны на фоне меню)
fullReset(false);
draw();

// Открываем стартовое меню при загрузке страницы (убеждаемся, что оно активно)
startOverlay.classList.remove('hide-overlay');

// При клике на кнопку "СТАРТ"
startBtn.addEventListener('click', (e) => {
    e.preventDefault();
    launchGame();
});

// Кнопка перезапуска (теперь показывает меню)
document.getElementById('restart').onclick = () => {
    restartFromButton();
};

// Управление с клавиатуры: работает только если игра активна и не Game Over, и меню скрыто
document.addEventListener('keydown', (e) => {
    // Если меню видно — игнорируем все клавиши (кроме возможной кнопки старта? но старт только кнопка, чтоб не сбить)
    if (!startOverlay.classList.contains('hide-overlay')) {
        // Если меню показано, то клавиши не должны управлять змейкой.
        // Но разрешаем пробел или Enter для старта по желанию — удобно.
        if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            launchGame();
        }
        return;
    }
    
    // Игра не активна (пауза или game over) — разрешаем новую игру через пробел, но без движения змейки
    if(!isGameActive || gameOver) {
        if(e.code === 'Space') {
            e.preventDefault();
            restartFromButton();
        }
        return;
    }
    
    // Активная игра: управление движением
    let k=e.key;
    if(k=='ArrowUp' && dir!='down'){ nextDir='up'; e.preventDefault(); }
    else if(k=='ArrowDown' && dir!='up'){ nextDir='down'; e.preventDefault(); }
    else if(k=='ArrowLeft' && dir!='right'){ nextDir='left'; e.preventDefault(); }
    else if(k=='ArrowRight' && dir!='left'){ nextDir='right'; e.preventDefault(); }
});

// Сенсорный геймпад (работает только при активной игре и скрытом меню)
const ctrlBtns = document.querySelectorAll('.ctrl-btn');
ctrlBtns.forEach(btn => {
    const handler = (e) => {
        e.preventDefault();
        // Если меню видно — не реагируем
        if (!startOverlay.classList.contains('hide-overlay')) return;
        if(!isGameActive || gameOver) return;
        const ndir = btn.getAttribute('data-dir');
        if(!ndir) return;
        if(ndir=='up' && dir!='down') nextDir='up';
        else if(ndir=='down' && dir!='up') nextDir='down';
        else if(ndir=='left' && dir!='right') nextDir='left';
        else if(ndir=='right' && dir!='left') nextDir='right';
    };
    btn.addEventListener('click', handler);
    btn.addEventListener('touchstart', handler, {passive: false});
});

// Дополнительная защита: если игра окончена и меню не активно, кнопка "НОВАЯ ИГРА" уже вызывает меню.
// Также убедимся, что при клике на оверлей случайно не передать клики на канвас.
startOverlay.addEventListener('click', (e) => {
    // Чтобы не закрыть меню случайно; только кнопка старт сработает
    e.stopPropagation();
});
</script>
</body>
</html>
